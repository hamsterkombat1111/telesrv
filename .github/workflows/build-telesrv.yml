name: Build telesrv (linux/amd64)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-telesrv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build telesrv
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Build telesrv (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/telesrv ./cmd/telesrv

      - name: Binary info
        run: |
          ls -lh dist/
          file dist/telesrv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telesrv-linux-amd64
          path: dist/telesrv
          if-no-files-found: error
          retention-days: 7
